# Merge only these keys into EcoEnchants/config.yml; preserve all other config.
original-procs:
  visuals:
    enabled: true
    max-scenes: 32
    per-source-scenes: 4
    profiles:
      eco_resonante:
        enabled: true
        phases:
          progress:
            steps:
              - primitive: MARK
                particle: DUST
                color: '#FFD166'
                size: 0.5
                duration: 2
                scale: 0.8
                height: 0.9
                quantity: 2
          resolved:
            sound: minecraft:block.note_block.bass
            sound-tick: 0
            volume: 0.3
            pitch: 0.7
            steps:
              - primitive: RING
                motion: CONTRACT
                particle: DUST
                color: '#FFD166'
                size: 0.5
                duration: 3
                scale: 0.8
                height: 0.4
                quantity: 2
              - primitive: RING
                motion: EXPAND
                particle: END_ROD
                at: 3
                duration: 2
                scale: 2.0
                height: 0.4
                quantity: 5
      brasa_errante:
        enabled: true
        phases:
          link:
            sound: minecraft:block.fire.extinguish
            sound-anchor: recipient
            sound-tick: 10
            volume: 0.2
            pitch: 1.6
            steps:
              - primitive: ARC
                particle: SMALL_FLAME
                duration: 10
                scale: 0.4
                height: 0.7
                quantity: 1
              - primitive: FLASH
                particle: WAX_OFF
                at: 10
                duration: 1
                scale: 0.4
                height: 0.7
                quantity: 6
